name: Release

# A version tag (v1.2.3, or v1.2.3-rc.1 for a prerelease) builds the binaries
# and publishes them with SHA256SUMS as a GitHub Release. Only a tag on a
# commit that is on main, whose version matches switchboard/Cargo.toml
# and the Claude Code plugin's (.github/scripts/set-version.sh sets both),
# and for which main's CI workflow (every platform, on the push to main)
# succeeded on exactly that commit is published: the release reuses that
# run instead of testing again, waiting up to 30 minutes for one still
# running. Tag a commit main's CI ran on (the tip of a push to main).
# Running the workflow by hand runs the tests and builds the same binaries
# as artifacts without publishing.
#
# Third-party actions are pinned by commit (the version in the comment), so a
# moved tag cannot change what runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: tag, version, and main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The tag names the release version, on a commit on main
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          [[ $TAG == v* && $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::bad version tag: $TAG"; exit 1; }
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' switchboard/Cargo.toml | head -n 1)
          # The tag, the crate, and the Claude Code plugin name one version.
          .github/scripts/check-versions.sh "$TAG"
          commit=$(git rev-parse HEAD)
          # "behind" or "identical": main contains the tagged commit.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$commit" --jq .status)
          case $status in
            behind | identical) echo "$TAG ($commit) is on main and names version $cargo" ;;
            *) echo "::error::$TAG ($commit) is not on main (compared with main: $status); release only from main"; exit 1 ;;
          esac

  main-ci:
    name: main's CI passed on this commit
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # Up to 30 minutes waiting for a CI run that is still going, then a
    # clear failure.
    timeout-minutes: 35
    permissions:
      actions: read
    steps:
      - name: Find main's CI run for exactly this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          # Runs of ci.yml on pushes to main for this exact commit, newest
          # first. A rerun of a run keeps its ID and reports its latest
          # attempt.
          runs() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&branch=main&event=push&per_page=20" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[] | [.status, (.conclusion // ""), .html_url] | @tsv'
          }
          deadline=$((SECONDS + 1800))
          while :; do
            found=$(runs)
            if [[ -z $found ]]; then
              echo "::error::No CI run on main for $TAG ($COMMIT). Releases reuse the CI run of the push to main that made this commit main's tip; tag such a commit (or push it to main so CI runs), then run this workflow again."
              exit 1
            fi
            if passed=$(awk -F '\t' '$1 == "completed" && $2 == "success" { print $3; exit }' <<< "$found") && [[ -n $passed ]]; then
              echo "main's CI passed on $COMMIT: $passed"
              exit 0
            fi
            latest=$(head -n 1 <<< "$found")
            status=$(cut -f 1 <<< "$latest") conclusion=$(cut -f 2 <<< "$latest") url=$(cut -f 3 <<< "$latest")
            if [[ $status == completed ]]; then
              echo "::error::main's CI on $TAG ($COMMIT) ended $conclusion: $url. Fix it, or rerun it if it failed for no reason; once it passes, run this workflow again."
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::main's CI on $TAG ($COMMIT) is still $status after 30 minutes: $url. Once it passes, run this workflow again."
              exit 1
            fi
            echo "main's CI on $COMMIT is $status ($url); checking again in 30 seconds"
            sleep 30
          done

  test:
    name: tests
    needs: verify
    # A run by hand has no CI run on main to reuse, so it runs the tests.
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/ci.yml
    with:
      all-platforms: true

  build:
    name: ${{ matrix.asset }}
    needs: [verify, main-ci, test]
    # One of main-ci (a tag) and test (a run by hand) runs; the other is
    # skipped.
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      (needs.main-ci.result == 'success' || needs.test.result == 'success')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: switchboard-darwin-arm64
            os: macos-15
            target: aarch64-apple-darwin
            deployment: "11.0"
          - asset: switchboard-darwin-x86_64
            os: macos-15
            target: x86_64-apple-darwin
            deployment: "10.13"
          # Linux: statically linked against musl (TLS is rustls with ring and
          # SQLite is bundled, so nothing links to the system's libraries),
          # cross-compiled with Zig as the C compiler and linker.
          - asset: switchboard-linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - asset: switchboard-linux-arm64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Version
        id: version
        shell: bash
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            version=${GITHUB_REF_NAME#v}
            [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad version tag: $GITHUB_REF_NAME" >&2; exit 1; }
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' switchboard/Cargo.toml | head -n 1)-dev.${GITHUB_SHA::7}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: runner.os == 'Linux'
        with:
          python-version: "3.13"
      - name: Install Zig and cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --disable-pip-version-check ziglang==0.17.0 cargo-zigbuild==0.24.0
          python3 -m pip list 2>/dev/null | grep -Ei 'ziglang|zigbuild'
          sudo apt-get install -y --no-install-recommends qemu-user-static
      - name: Build
        shell: bash
        env:
          SWITCHBOARD_VERSION: ${{ steps.version.outputs.version }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
        run: |
          if [[ $RUNNER_OS == Linux ]]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
          mkdir -p dist
          cp target/${{ matrix.target }}/release/switchboard dist/${{ matrix.asset }}
      - name: Check the binary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          binary=dist/${{ matrix.asset }}
          file "$binary"
          ls -l "$binary"
          case ${{ matrix.target }} in
            *-linux-musl) file "$binary" | grep -q 'statically linked' || { echo "not static" >&2; exit 1; } ;;
          esac
          case ${{ matrix.target }} in
            aarch64-unknown-linux-musl) run=(qemu-aarch64-static "$binary") ;;
            x86_64-apple-darwin) run=(arch -x86_64 "$binary") ;;
            *) run=("$binary") ;;
          esac
          if [[ ${{ matrix.target }} == x86_64-apple-darwin ]] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta is unavailable on this runner; not running the x86_64 binary"
          else
            [[ $("${run[@]}" --version) == "switchboard $VERSION" ]] || { echo "wrong version: $("${run[@]}" --version)" >&2; exit 1; }
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish
    needs: [verify, main-ci, build]
    if: >-
      !cancelled() && github.ref_type == 'tag' && needs.verify.result == 'success' &&
      needs.main-ci.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum switchboard-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          [[ $TAG != *-* ]] || prerelease=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Switchboard ${TAG#v}" --generate-notes "${prerelease[@]}" \
            dist/switchboard-* dist/SHA256SUMS
